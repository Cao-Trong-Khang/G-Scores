services:
  postgres:
    image: postgres:16-alpine
    container_name: g-score-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gscore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gscore_password}
      POSTGRES_DB: ${POSTGRES_DB:-gscore_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
